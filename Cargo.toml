[workspace]
resolver = "2"
members = [
    "crates/kamish-audit",
    "crates/kamish-policy",
    "crates/kamish-enforce",
    "crates/kamish-log",
    "cmd/kamish-broker",
    "cmd/kamish-agent",
    "cmd/kamish-ctl",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Kamish Team"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
