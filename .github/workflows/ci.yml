name: CI Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  format-and-lint:
    name: Code Formatting and Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Cargo clippy check
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  test-workspace:
    name: Rust Workspace & Probes Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Run Workspace Tests
        run: cargo test --workspace

      - name: Run Research Probes
        if: runner.os == 'Linux'
        run: |
          cd early_research/probes
          cargo test

  frontend-and-sdk:
    name: Frontend & SDK Quality Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.12.0'
          cache: 'npm'

      - name: Install Frontend Dependencies & Run Tests
        run: |
          cd frontend
          npm ci
          npm test
          npm run build

      - name: Build & Test TypeScript SDK
        run: |
          cd packages/kamish-client
          npm ci
          npm test
          npm run build

  packaging-cleanroom:
    name: Packaging & Clean-Room Verification
    runs-on: ubuntu-latest
    needs: [format-and-lint, test-workspace, frontend-and-sdk]
    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '22.12.0'

      - name: Setup Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: '3.12'

      - name: Build Release Binary
        run: |
          cargo build --release -p kamish
          strip target/release/kamish
          cp target/release/kamish packages/kamish-linux-x64/bin/kamish

      - name: Pack Tarballs
        run: |
          mkdir -p /tmp/kamish_cleanroom
          (cd packages/kamish-client && npm pack --pack-destination /tmp/kamish_cleanroom)
          (cd packages/kamish-linux-x64 && npm pack --pack-destination /tmp/kamish_cleanroom)
          (cd packages/kamish-linux-arm64 && npm pack --pack-destination /tmp/kamish_cleanroom)
          (cd packages/kamish-darwin-x64 && npm pack --pack-destination /tmp/kamish_cleanroom)
          (cd packages/kamish-darwin-arm64 && npm pack --pack-destination /tmp/kamish_cleanroom)
          (cd packages/kamish-win32-x64 && npm pack --pack-destination /tmp/kamish_cleanroom)
          (cd packages/kamish && npm pack --pack-destination /tmp/kamish_cleanroom)

      - name: Run Cross-Platform Windows & macOS Simulation Tests
        run: python3 scripts/test_cross_platform_npm.py

      - name: Run Clean-Room Install Test
        run: python3 scripts/test_clean_room.py
