[package]
name = "kamish"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "kamish"
path = "src/main.rs"

[dependencies]
kamish-audit = { path = "../../crates/kamish-audit" }
kamish-policy = { path = "../../crates/kamish-policy" }
kamish-enforce = { path = "../../crates/kamish-enforce" }
kamish-log = { path = "../../crates/kamish-log" }
kamish-meta = { path = "../../crates/kamish-meta" }
kamish-outbox = { path = "../../crates/kamish-outbox" }
kamish-route = { path = "../../crates/kamish-route" }
kamish-own = { path = "../../crates/kamish-own" }
kamish-seal = { path = "../../crates/kamish-seal" }
kamish-checkers = { path = "../../crates/kamish-checkers" }
kamish-client = { path = "../../crates/kamish-client" }
kamish-broker = { path = "../kamish-broker" }
kamish-gateway = { path = "../kamish-gateway" }
kamish-agent = { path = "../kamish-agent" }
clap = { workspace = true }
clap_complete = "4.5"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
rand = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "json", "matched-path"] }
rust-embed = { version = "8.13", features = ["include-exclude", "compression"] }
mime_guess = "2.0"
tempfile = "3.17"
hyper = { version = "1.0", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tempfile = "3.17"
