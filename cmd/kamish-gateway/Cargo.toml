[package]
name = "kamish-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
kamish-broker = { path = "../kamish-broker" }
kamish-client = { path = "../../crates/kamish-client" }
kamish-meta = { path = "../../crates/kamish-meta" }
kamish-policy = { path = "../../crates/kamish-policy" }
kamish-audit = { path = "../../crates/kamish-audit" }
kamish-checkers = { path = "../../crates/kamish-checkers" }
kamish-route = { path = "../../crates/kamish-route" }
kamish-log = { path = "../../crates/kamish-log" }
kamish-enforce = { path = "../../crates/kamish-enforce" }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "http2", "json", "matched-path"] }
tower = { version = "0.5", features = ["util"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["sync"] }

[dev-dependencies]
tempfile = "3.17"
http-body-util = "0.1"
