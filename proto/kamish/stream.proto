syntax = "proto3";

package kamish.stream;

// StreamService provides data plane ingress and egress for sovereign streams.
service StreamService {
    // Ingest event batches subject to local region legal set verification (E1/E2).
    rpc Produce(ProduceBatchRequest) returns (ProduceBatchResponse);

    // Fetch committed records bounded by partition High-Water Mark (E5).
    rpc Fetch(FetchRecordsRequest) returns (FetchRecordsResponse);

    // Query topic and partition metadata including epoch and leader lease.
    rpc GetPartitionMetadata(PartitionMetadataRequest) returns (PartitionMetadataResponse);
}

// ReplicationService handles inter-region sovereign transfers and watermark synchronization.
service ReplicationService {
    // Transfer replication ranges from durable outbox (E3/E4).
    rpc TransferReplicationRange(ReplicationRangeRequest) returns (ReplicationRangeResponse);

    // Query highest applied offset for resumable transfer.
    rpc GetDurableWatermark(WatermarkRequest) returns (WatermarkResponse);
}

// GovernanceService manages policy distribution and tamper-evident audit inspection.
service GovernanceService {
    // Distribute signed policy packages to regions (E9).
    rpc PublishPolicy(SignedPolicyEnvelope) returns (PublishPolicyResponse);

    // Query current policy version and staleness.
    rpc GetActivePolicy(ActivePolicyRequest) returns (ActivePolicyResponse);

    // Inspect and verify regional hash-chained decision log.
    rpc VerifyAuditChain(VerifyAuditRequest) returns (VerifyAuditResponse);
}

// ClusterCoordinationService handles leader leases, fencing, and failover promotion.
service ClusterCoordinationService {
    // Heartbeat to renew time-bounded partition ownership lease.
    rpc RenewPartitionLease(LeaseRenewalRequest) returns (LeaseRenewalResponse);

    // Attempt promotion to partition ownership gated by policy eligibility (E8).
    rpc PromotePartitionOwner(PromotionRequest) returns (PromotionResponse);
}

// --- Message Payloads ---

message RecordHeader {
    string key = 1;
    bytes value = 2;
}

message SovereignRecord {
    string class_id = 1;
    int64 timestamp_ns = 2;
    bytes key = 3;
    bytes payload = 4;
    repeated RecordHeader headers = 5;
}

message ProduceBatchRequest {
    string topic = 1;
    uint32 partition = 2;
    uint64 producer_id = 3;
    uint64 producer_epoch = 4;
    uint32 sequence_base = 5;
    string class_id = 6;
    repeated SovereignRecord records = 7;
}

message ProduceBatchResponse {
    uint64 base_offset = 1;
    uint32 count = 2;
    uint64 committed_epoch = 3;
    bool sovereignty_allowed = 4;
    string denial_reason = 5;
}

message FetchRecordsRequest {
    string topic = 1;
    uint32 partition = 2;
    uint64 start_offset = 3;
    uint32 max_records = 4;
    uint32 max_bytes = 5;
}

message FetchRecordsResponse {
    uint64 high_watermark = 1;
    repeated bytes serialized_envelopes = 2;
}

message PartitionMetadataRequest {
    string topic = 1;
    uint32 partition = 2;
}

message PartitionMetadataResponse {
    string topic = 1;
    uint32 partition = 2;
    string leader_region = 3;
    uint64 current_epoch = 4;
    int64 lease_expiry_ns = 5;
    uint64 high_watermark = 6;
}

message ReplicationRangeRequest {
    string topic = 1;
    uint32 partition = 2;
    string source_region = 3;
    string target_region = 4;
    string class_id = 5;
    uint64 from_offset = 6;
    uint64 to_offset = 7;
    bool is_sealed_copy = 8;
    bytes sealed_key_ref = 9;
    bytes payload_data = 10;
}

message ReplicationRangeResponse {
    bool accepted = 1;
    uint64 applied_watermark = 2;
    string reason = 3;
}

message WatermarkRequest {
    string topic = 1;
    uint32 partition = 2;
    string source_region = 3;
}

message WatermarkResponse {
    uint64 durable_watermark = 1;
}

message SignedPolicyEnvelope {
    bytes policy_json = 1;
    string signature_hex = 2;
}

message PublishPolicyResponse {
    bool accepted = 1;
    uint64 current_version = 2;
    string error_message = 3;
}

message ActivePolicyRequest {}

message ActivePolicyResponse {
    uint64 version = 1;
    int64 issued_at_sec = 2;
    uint64 ttl_seconds = 3;
    bool is_fresh = 4;
}

message VerifyAuditRequest {
    uint64 start_sequence = 1;
    uint64 end_sequence = 2;
}

message VerifyAuditResponse {
    bool integrity_verified = 1;
    uint64 total_entries = 2;
    string tail_hash = 3;
}

message LeaseRenewalRequest {
    string topic = 1;
    uint32 partition = 2;
    string leader_region = 3;
    uint64 epoch = 4;
    int64 duration_ms = 5;
}

message LeaseRenewalResponse {
    bool renewed = 1;
    int64 expiry_ns = 2;
}

message PromotionRequest {
    string topic = 1;
    uint32 partition = 2;
    string candidate_region = 3;
    uint64 current_epoch = 4;
}

message PromotionResponse {
    bool promoted = 1;
    uint64 new_epoch = 2;
    string reason = 3;
}
