services:
  etcd-1:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: kamish-etcd-1
    command:
      - etcd
      - --name=us-east
      - --initial-advertise-peer-urls=http://etcd-1:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2379
      - --initial-cluster-token=kamish-etcd-cluster
      - --initial-cluster=us-east=http://etcd-1:2380,eu-central=http://etcd-2:2380,ap-south=http://etcd-3:2380
      - --initial-cluster-state=new
    ports:
      - "2379:2379"
    restart: unless-stopped

  etcd-2:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: kamish-etcd-2
    command:
      - etcd
      - --name=eu-central
      - --initial-advertise-peer-urls=http://etcd-2:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2381
      - --initial-cluster-token=kamish-etcd-cluster
      - --initial-cluster=us-east=http://etcd-1:2380,eu-central=http://etcd-2:2380,ap-south=http://etcd-3:2380
      - --initial-cluster-state=new
    ports:
      - "2381:2379"
    restart: unless-stopped

  etcd-3:
    image: quay.io/coreos/etcd:v3.5.15
    container_name: kamish-etcd-3
    command:
      - etcd
      - --name=ap-south
      - --initial-advertise-peer-urls=http://etcd-3:2380
      - --listen-peer-urls=http://0.0.0.0:2380
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://127.0.0.1:2383
      - --initial-cluster-token=kamish-etcd-cluster
      - --initial-cluster=us-east=http://etcd-1:2380,eu-central=http://etcd-2:2380,ap-south=http://etcd-3:2380
      - --initial-cluster-state=new
    ports:
      - "2383:2379"
    restart: unless-stopped
