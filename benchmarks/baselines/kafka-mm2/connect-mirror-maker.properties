# Apache Kafka MirrorMaker 2 Replication Configuration (W32)
clusters = eu-west, us-east

eu-west.bootstrap.servers = kafka-eu-west:9092
us-east.bootstrap.servers = kafka-us-east:9094

# Replication flows
eu-west->us-east.enabled = true
eu-west->us-east.topics = .*
eu-west->us-east.groups = .*

# Durability settings
replication.factor = 3
min.insync.replicas = 2
checkpoints.topic.replication.factor = 3
heartbeats.topic.replication.factor = 3
offset-syncs.topic.replication.factor = 3

# High frequency synchronization
sync.topic.acls.enabled = false
emit.heartbeats.interval.seconds = 1
emit.checkpoints.interval.seconds = 1
