version: "3.8"
services:
  pulsar-standalone:
    image: apachepulsar/pulsar:4.0.0
    container_name: pulsar-eu-west
    command: bin/pulsar standalone
    ports:
      - "6650:6650"
      - "8080:8080"
    environment:
      PULSAR_PREFIX_managedLedgerDefaultEnsembleSize: 3
      PULSAR_PREFIX_managedLedgerDefaultWriteQuorum: 3
      PULSAR_PREFIX_managedLedgerDefaultAckQuorum: 2
      PULSAR_PREFIX_clusterName: eu-west
